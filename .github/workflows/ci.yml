name: CI

# When this workflow runs:
# - every push to main
# - every pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Pulls your repo's code onto the runner. Nothing else works without this.
      - name: Checkout code
        uses: actions/checkout@v6

      # Installs a JDK on the runner. Must match what your project builds with —
      # your convention plugins call jvmToolchain(17), so we install 17 here too.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Configures Gradle on the runner and transparently caches dependencies +
      # build outputs between runs, so you're not re-downloading the internet
      # on every single push.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Git doesn't always preserve the executable bit on gradlew when checked
      # out fresh on a runner, so this makes sure ./gradlew is actually runnable.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Static analysis: catches things like deprecated API usage, missing
      # resources, and Compose-specific lint issues before they merge.
      - name: Run lint
        run: ./gradlew lint

      # Runs every JVM unit test in src/test across all modules — this is
      # exactly what runs locally when you hit the test button in Android
      # Studio: HomeViewModelTest, SubCategoryViewModelTest, etc.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Confirms the app actually assembles into an installable APK. Catches
      # build-config regressions that tests alone wouldn't (e.g. a manifest
      # merge conflict, a missing resource referenced only at build time).
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Saves the lint HTML report and test results so you can open them from
      # the Actions run page even after the runner is gone.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/test-results/**
            **/build/reports/tests/**
